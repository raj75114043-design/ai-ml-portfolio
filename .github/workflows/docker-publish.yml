name: Publish Docker images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [multi-agent-rca-langgraph, enterprise-hybrid-rag, pharma-sop-copilot, mcp-enterprise-servers, knowledge-graph-builder, pharma-oos-oot-analytics, demand-forecasting-ml, predictive-maintenance-classifier, support-ticket-nlp, mlops-pipeline-template]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.project }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
