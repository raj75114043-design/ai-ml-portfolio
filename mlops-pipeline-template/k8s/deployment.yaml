apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: model-api}
  template:
    metadata:
      labels: {app: model-api}
    spec:
      containers:
        - name: model-api
          image: ghcr.io/raj75114043-design/ai-ml-portfolio/mlops-pipeline-template:latest
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: model-api
spec:
  selector: {app: model-api}
  ports: [{port: 80, targetPort: 8000}]
